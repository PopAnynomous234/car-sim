<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>McLaren Airport Test</title>
  <link rel="icon" href="data:," />
  <style>
    body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
    #hud {
      position: absolute; top: 16px; left: 16px; color: #fff;
      background: rgba(0, 0, 0, 0.65); padding: 12px 16px; border-radius: 8px;
      line-height: 1.5; font-size: 14px;
    }
    #speed { font-size: 22px; font-weight: bold; color: #ff6a00; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="speed">0 MPH</div>
    WASD / Arrows: Drive • Space: Handbrake • R: Reset Car<br>
    <span id="status">Loading models...</span>
  </div>

  <script type="module">
    import * as THREE from 'https://jsdelivr.net';
    import { GLTFLoader } from 'https://jsdelivr.net';
    import { DRACOLoader } from 'https://jsdelivr.net';

    const statusEl = document.getElementById('status');
    const speedEl = document.getElementById('speed');

    // 1. Scene & Optimized Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 300, 2500);

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.2, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // 2. Lighting
    scene.add(new THREE.HemisphereLight(0xffffff, 0x445544, 1.4));
    const sun = new THREE.DirectionalLight(0xfff5e4, 2.0);
    sun.position.set(150, 300, 150);
    scene.add(sun);

    // Backup Grass Floor
    const fallbackGrass = new THREE.Mesh(
      new THREE.PlaneGeometry(10000, 10000),
      new THREE.MeshStandardMaterial({ color: 0x3b6e3c, roughness: 0.9 })
    );
    fallbackGrass.rotation.x = -Math.PI / 2;
    fallbackGrass.position.y = -0.05;
    scene.add(fallbackGrass);

    // 3. GLTF + Draco Loader Setup
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://gstatic.com');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    // Load Airport Map
    loader.load('./airport.glb', (gltf) => {
      const airport = gltf.scene;
      const box = new THREE.Box3().setFromObject(airport);
      airport.position.y = -box.min.y;
      scene.add(airport);
      statusEl.textContent = 'Airport loaded!';
    }, undefined, (err) => {
      console.error(err);
      statusEl.textContent = 'Error loading airport.glb (check filename)';
    });

    // Load & Auto-Scale McLaren Car
    const carPivot = new THREE.Group();
    scene.add(carPivot);

    loader.load('./mclaren.glb', (gltf) => {
      const carModel = gltf.scene;

      const box = new THREE.Box3().setFromObject(carModel);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      const scaleFactor = 4.5 / maxDim;
      carModel.scale.setScalar(scaleFactor);

      const scaledBox = new THREE.Box3().setFromObject(carModel);
      const center = new THREE.Vector3();
      scaledBox.getCenter(center);
      carModel.position.x -= center.x;
      carModel.position.z -= center.z;
      carModel.position.y -= scaledBox.min.y;

      carPivot.add(carModel);
      statusEl.textContent = 'Ready to drive!';
    }, undefined, (err) => {
      console.error(err);
      statusEl.textContent = 'Error loading mclaren.glb (check filename)';
    });

    // 4. Car Controls & Driving Physics
    const keys = {};
    onkeydown = (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyR') {
        carPivot.position.set(0, 0, 0);
        carPivot.rotation.set(0, 0, 0);
        speed = 0;
      }
    };
    onkeyup = (e) => keys[e.code] = false;

    onresize = () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    };

    let speed = 0;
    let steering = 0;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      const forward = (keys.KeyW || keys.ArrowUp) ? 1 : 0;
      const reverse = (keys.KeyS || keys.ArrowDown) ? 1 : 0;
      const brake = keys.Space ? 1 : 0;
      const steerInput = ((keys.KeyA || keys.ArrowLeft) ? 1 : 0) - ((keys.KeyD || keys.ArrowRight) ? 1 : 0);

      if (forward) speed += 36 * dt;
      else if (reverse) speed -= 24 * dt;
      else speed *= Math.pow(0.45, dt);

      if (brake) speed *= Math.pow(0.04, dt);
      speed = THREE.MathUtils.clamp(speed, -25, 92);

      steering = THREE.MathUtils.lerp(steering, steerInput * 2.4, 8 * dt);
      if (Math.abs(speed) > 0.3) {
        carPivot.rotation.y += steering * (speed / 40) * dt;
      }

      carPivot.position.x += Math.sin(carPivot.rotation.y) * speed * dt;
      carPivot.position.z += Math.cos(carPivot.rotation.y) * speed * dt;

      const camOffset = new THREE.Vector3(0, 2.2, -6.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), carPivot.rotation.y);
      camera.position.lerp(carPivot.position.clone().add(camOffset), 12 * dt);
      camera.lookAt(carPivot.position.x, carPivot.position.y + 1.0, carPivot.position.z);

      speedEl.textContent = `${Math.round(Math.abs(speed) * 2.237)} MPH`;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
