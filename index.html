<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Car Simulator in browser</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#f7f8fb; --muted:#a3a8b7; --line:rgba(255,255,255,.16); --glass:rgba(13,14,19,.68); --accent:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; overflow:hidden; background:#050609; font-family:'DM Sans',system-ui,sans-serif; color:var(--ink); user-select:none; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(circle at 72% 18%,rgba(255,255,255,.12),transparent 30%),radial-gradient(circle at 10% 85%,rgba(87,97,128,.18),transparent 32%),#050609; }
  .panel { position:fixed; background:var(--glass); border:1px solid var(--line); box-shadow:0 18px 50px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.08); backdrop-filter:blur(18px); border-radius:18px; padding:12px 16px; font-size:13px; line-height:1.55; }
  button { font:inherit; color:var(--ink); background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:12px; padding:9px 13px; cursor:pointer; transition:.2s ease; }
  button:hover { background:rgba(255,255,255,.14); transform:translateY(-1px); }
  button.on, .primary { color:#090a0d; background:#fff; border-color:#fff; }
  #home, #loadingScreen { position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:linear-gradient(135deg,#050609 0%,#11131b 55%,#050609 100%); }
  #home { display:none; overflow:auto; padding:32px; }
  .home-card { width:min(1060px,100%); padding:clamp(24px,5vw,58px); border:1px solid var(--line); border-radius:32px; background:rgba(255,255,255,.055); box-shadow:0 30px 100px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.1); backdrop-filter:blur(24px); }
  .garage { display:grid; grid-template-columns:90px 1fr 90px; align-items:center; gap:18px; margin:34px 0; }
  .garage-stage { min-height:180px; display:grid; place-items:center; text-align:center; border-radius:24px; background:radial-gradient(circle,rgba(255,255,255,.18),transparent 62%),linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.025)); }
  #carPreview { width:100%; height:180px; display:block; }
  .car-name { font-family:'Space Grotesk'; font-size:28px; margin-top:10px; }
  .arrow { width:64px; height:64px; border-radius:50%; font-size:28px; }
  .play { padding:18px 28px; min-width:220px; font-size:18px; font-weight:700; border-radius:16px; }
  .map-stage { display:none; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin-top:30px; }
  .map-stage.visible { display:grid; }
  .map-choice { min-height:220px; text-align:left; padding:14px; border-radius:22px; background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.03)); }
  .map-preview { width:100%; height:145px; display:block; border-radius:14px; background:#141820; }
  .map-choice.selected { outline:2px solid #fff; }
  .map-choice strong { display:block; font-family:'Space Grotesk'; font-size:25px; margin:10px 0 4px; }
  #settings { display:none; z-index:30; top:50%; left:50%; transform:translate(-50%,-50%); width:min(420px,calc(100% - 32px)); }
  #settings.open { display:block; }
  .setting-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid var(--line); }
  .setting-row select { color:var(--ink); background:#171922; border:1px solid var(--line); border-radius:8px; padding:7px; }
  #touchControls { position:fixed; inset:auto 18px 18px 18px; display:none; justify-content:space-between; pointer-events:none; z-index:12; }
  .touch-cluster { display:flex; gap:10px; pointer-events:auto; }
  .touch-btn { width:64px; height:58px; font-size:20px; touch-action:none; }
  #speedometer { position:fixed; top:18px; right:285px; width:154px; height:154px; display:grid; place-items:center; border-radius:50%; background:conic-gradient(from 220deg,#eef8ff 0 26%,#54c6db 43%,#8fe8ec 67%,#ff754f 84%,rgba(255,255,255,.1) 0); box-shadow:0 12px 35px rgba(0,0,0,.25); }
  #speedometer::after { content:""; position:absolute; inset:10px; border-radius:50%; background:radial-gradient(circle at 50% 80%,#293b49,#101820 65%); border:2px solid rgba(255,255,255,.55); }
  #speedometer::before { content:""; position:absolute; inset:18px; border-radius:50%; background:repeating-conic-gradient(from 220deg,rgba(255,255,255,.9) 0 1deg,transparent 1deg 8deg); mask:radial-gradient(transparent 0 78%,#000 80%); z-index:1; }
  .speed-fill { position:absolute; z-index:2; bottom:25px; left:50%; width:12px; height:45px; border-radius:8px; background:#ff684d; transform-origin:50% 100%; transform:translateX(-50%) rotate(-42deg); transition:transform .08s linear; }
  #speedReadout { position:relative; z-index:3; text-align:center; font-family:'Space Grotesk'; font-size:34px; font-weight:700; }
  #speedReadout small { display:block; font:11px 'DM Sans'; color:var(--muted); letter-spacing:.14em; }
  #fps { position:fixed; top:8px; left:50%; transform:translateX(-50%); color:#fff; font:11px monospace; opacity:.8; z-index:12; }
  #driftToggle { min-width:90px; }
  .eyebrow { color:var(--muted); font-size:11px; letter-spacing:.22em; text-transform:uppercase; }
  h1,h2,h3 { font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-.04em; }
  h1 { font-size:clamp(42px,8vw,82px); line-height:.95; max-width:760px; margin:14px 0 18px; }
  .lead { color:var(--muted); max-width:580px; font-size:16px; }
  .choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:32px 0; }
  .choice { text-align:left; min-height:122px; padding:20px; border-radius:20px; border:1px solid var(--line); background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.025)); }
  .choice.selected { outline:2px solid #fff; background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.04)); }
  .choice strong { display:block; font-family:'Space Grotesk'; font-size:22px; margin:8px 0 5px; }
  .choice small { color:var(--muted); }
  .launch { width:100%; padding:16px 22px; font-size:16px; font-weight:700; border-radius:15px; }
  .loading-card { width:min(460px,calc(100% - 40px)); text-align:center; }
  .loader-ring { width:54px; height:54px; margin:24px auto; border:2px solid rgba(255,255,255,.15); border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; }
  .loading-detail { color:var(--muted); font-size:13px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width:700px) { .map-stage { grid-template-columns:1fr; } .home-card { padding:28px 20px; } #speedometer { right:16px; transform:scale(.8); transform-origin:top right; } #stats { display:none; } .garage { grid-template-columns:56px 1fr 56px; gap:8px; } .arrow { width:52px; height:52px; } }
  #minimap { position:fixed; top:16px; left:16px; width:200px; height:200px; border-radius:50%; border:3px solid rgba(255,255,255,.9); box-shadow:0 0 14px rgba(0,0,0,.65); background:#2b3d2b; }
  #cams { position:fixed; top:14px; left:50%; transform:translateX(-50%); display:flex; gap:6px; }
  #stats { top:16px; right:16px; width:250px; }
  #dash { bottom:16px; right:16px; width:235px; text-align:center; }
  #help { bottom:16px; left:16px; font-size:12px; max-width:310px; }
  #help b { color:#ffb067; }
  .bar { height:8px; background:rgba(255,255,255,.2); border-radius:4px; overflow:hidden; margin:3px 0 6px; }
  .bar i { display:block; height:100%; width:0; background:#4caf50; }
  .bar i.blue { background:#35a7ff; }
  .bar i.red { background:#ff3b30; }
  #money { font-size:20px; color:#7dff8a; }
  #lap { color:#ffd400; font-weight:600; }
  #speed { display:none; }
  .unit { font-size:12px; opacity:.8; margin-bottom:6px; }
  #gear { display:inline-block; min-width:44px; font-size:30px; font-weight:700; border:2px solid #fff; border-radius:8px; padding:0 8px; margin-right:8px; }
  #surface { height:16px; font-size:12px; font-weight:700; color:#ff9a3c; margin-top:4px; }
  #toast { position:fixed; top:58px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.72); padding:8px 16px;
           border-radius:8px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
  #drift { position:fixed; bottom:110px; left:50%; transform:translateX(-50%); font-size:26px; font-weight:800;
           color:#ffd400; text-shadow:0 2px 6px #000; display:none; }
  #status { position:fixed; bottom:6px; left:50%; transform:translateX(-50%); font-size:12px; opacity:.9; text-shadow:0 1px 3px #000; }
</style>
</head>
<body>
  <section id="loadingScreen">
    <div class="loading-card">
      <div class="eyebrow">Three.js driving experience</div>
      <h2>Car Simulator in browser</h2>
      <div class="loader-ring"></div>
      <div id="loadingText" class="loading-detail">Preparing your garage...</div>
    </div>
  </section>
  <section id="home">
    <div class="home-card">
      <div class="eyebrow">Car Simulator in browser</div>
      <h1 id="homeTitle">Your garage.</h1>
      <p class="lead">Choose a car, then pick a world and drive.</p>
      <div class="garage">
        <button id="carPrev" class="arrow" aria-label="Previous car">←</button>
        <div class="garage-stage"><div><canvas id="carPreview" width="640" height="360"></canvas><div id="carName" class="car-name">Tesla X</div></div></div>
        <button id="carNext" class="arrow" aria-label="Next car">→</button>
      </div>
      <button id="play" class="play primary">PLAY</button>
      <div id="mapStage" class="map-stage">
        <button class="map-choice selected" data-map="racetrack"><canvas id="racetrackPreview" class="map-preview" width="640" height="260"></canvas><span class="eyebrow">Map 01</span><strong>Racetrack</strong><small>Fast laps and sweeping corners.</small></button>
        <button class="map-choice" data-map="city"><canvas id="cityPreview" class="map-preview" width="640" height="260"></canvas><span class="eyebrow">Map 02</span><strong>City</strong><small>Urban streets and open exploration.</small></button>
      </div>
      <button id="launch" class="launch primary" style="display:none">Enter the simulator <span>→</span></button>
    </div>
  </section>
  <canvas id="minimap" width="200" height="200"></canvas>

  <div id="cams">
    <button data-cam="0" class="on">1 Chase</button>
    <button data-cam="1">2 Cockpit</button>
    <button data-cam="2">3 Side</button>
  </div>

  <div id="stats" class="panel">
    <div id="lap"></div>
    <div id="lapBest" style="font-size:12px"></div>
    <div id="timeTxt"></div>
    <button id="settingsButton">⚙ Settings</button>
  </div>

  <div id="dash" class="panel">
    <span id="gear">N</span><button id="gearMode">AUTO</button>
    <div class="bar" style="margin-top:8px"><i id="rpmBar"></i></div>
    <div id="rpmTxt" style="font-size:12px">0 RPM</div>
    <div id="surface"></div>
  </div>

  <div id="speedometer"><div id="speedFill" class="speed-fill"></div><div id="speedReadout">0<small>KM/H</small></div></div>
  <div id="fps">FPS --</div>
  <div id="touchControls">
    <div class="touch-cluster"><button class="touch-btn" data-key="KeyA">←</button><button class="touch-btn" data-key="KeyD">→</button></div>
    <div class="touch-cluster"><button class="touch-btn" data-key="Space">DRIFT</button><button class="touch-btn" data-key="KeyS">▼</button><button class="touch-btn" data-key="KeyW">▲</button></div>
  </div>
  <div id="settings" class="panel">
    <h3>Settings</h3>
    <div class="setting-row"><span>Drift assist</span><button id="driftToggle" class="on">ON</button></div>
    <div class="setting-row"><span>Quality</span><select id="qualitySelect"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="1440">1440p</option></select></div>
    <div class="setting-row"><span>Camera</span><button id="cameraButton">CHASE</button></div>
    <div class="setting-row"><span>Time of day</span><button id="timeButton">DAY</button></div>
    <button id="closeSettings" class="launch primary">Done</button>
  </div>

  <div id="toast"></div>
  <div id="drift"></div>
  <div id="status">Loading Three.js...</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const setStatus = (t) => { $('status').textContent = t; $('loadingText').textContent = t || 'Loading your drive...'; };

// ===================== CONFIG (tweak here) =====================
const CFG = {
  TRACK_FILE: './racetrack.glb',
  CAR_FILE: './tesla_x.glb',
  CAR_LENGTH: 4.5,
  CAR_YAW_FIX: 0,                  // set Math.PI if the car drives backwards

  // Start/finish line of racetrack.glb (found from the SFLINE mesh), in model/world meters.
  // heading: driving direction in radians (forward = (sin h, cos h)); y = road height at the line.
  START_LINE: { x: 295.0, z: -315.1, y: -7.1, heading: 2.38 },
  REVERSE_DIRECTION: false,        // true = grid on the other side of the line, driving the opposite way
  START_BEHIND: 8,                 // meters behind the line the car spawns
  GAS_AHEAD: 60,                   // gas station distance ahead of the line (O moves it)
  MIN_LAP_DIST: 600,               // must get this far from the line before a lap counts
  LAP_REWARD: 200,

  CHASE: [0, 2.2, -6.5],           // camera offsets in car-local coords (x = left, y = up, z = forward)
  COCKPIT: [0.35, 0.95, 0.1],
  SIDE: [5.5, 1.4, 0.3],
  HIDE_BODY_IN_COCKPIT: false,

  MAP_BAKE_SIZE: 1536,             // minimap texture size (px)
  MAP_MAX_EXTENT: 4000,            // max meters covered by the minimap
  VIEW_DISTANCE: 2000,
  MAX_PIXEL_RATIO: 1.25,           // dynamic resolution range (auto-adjusts to keep ~45-60 fps)
  MIN_PIXEL_RATIO: 0.6,
  QUALITY: 1080,

  START_MONEY: 500,
  TANK: 60,
  FUEL_PRICE: 3,                   // $ per liter
  HEADLIGHT_INTENSITY: 300,
};

// ===================== THREE.JS FROM JSDELIVR =====================
const VER = '0.160.0';
const HOSTS = [
  'https://cdn.jsdelivr.net',
  'https://fastly.jsdelivr.net',
  'https://gcore.jsdelivr.net',
  'https://testingcf.jsdelivr.net'
];
let THREE, GLTFLoader, DRACOLoader, CDN;
for (const host of HOSTS) {
  try {
    setStatus(`Loading Three.js from ${host} ...`);
    const base = `${host}/npm/three@${VER}`;
    [THREE, { GLTFLoader }, { DRACOLoader }] = await Promise.all([
      import(`${base}/+esm`),
      import(`${base}/examples/jsm/loaders/GLTFLoader.js/+esm`),
      import(`${base}/examples/jsm/loaders/DRACOLoader.js/+esm`)
    ]);
    CDN = base;
    break;
  } catch (e) { console.warn('CDN failed:', host, e); }
}
if (!CDN) { setStatus('All jsDelivr mirrors failed on this network.'); throw new Error('No CDN reachable'); }
$('loadingScreen').style.display = 'none';
$('home').style.display = 'grid';

// ===================== SAVE DATA =====================
const SAVE_KEY = 'mclaren-racetrack-save-v1';
const save = { money: CFG.START_MONEY, paint: 0, tune: 0, best: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} };

// ===================== SCENE =====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 300, 1500);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, CFG.VIEW_DISTANCE);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
let pixelRatio = Math.min(devicePixelRatio, CFG.MAX_PIXEL_RATIO);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff, 0x445544, 1.4);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff5e4, 2.0);
sun.position.set(150, 300, 150);
scene.add(sun);

// far-away ground plane (moved below the lowest point of the track once it loads)
const fallbackGrass = new THREE.Mesh(
  new THREE.PlaneGeometry(10000, 10000),
  new THREE.MeshStandardMaterial({ color: 0x3b6e3c, roughness: 0.9 })
);
fallbackGrass.rotation.x = -Math.PI / 2;
fallbackGrass.position.y = -100;
scene.add(fallbackGrass);

// ===================== TIME OF DAY =====================
const TODS = [
  { name: 'Day',    sky: 0x87ceeb, ground: 0x445544, hemi: 1.4, sun: 2.0, sunCol: 0xfff5e4, pos: [150, 300, 150],   exp: 1.1, fogFar: 1500 },
  { name: 'Sunset', sky: 0xf08a5d, ground: 0x553322, hemi: 0.9, sun: 1.4, sunCol: 0xff9a55, pos: [400, 70, 120],    exp: 1.0, fogFar: 1200 },
  { name: 'Night',  sky: 0x05070f, ground: 0x0b0b14, hemi: 0.3, sun: 0.12, sunCol: 0x6a7fc0, pos: [-150, 250, -100], exp: 0.9, fogFar: 600 },
  { name: 'Dawn',   sky: 0xe0a899, ground: 0x4a4048, hemi: 0.7, sun: 0.9, sunCol: 0xffc08a, pos: [-400, 60, 100],   exp: 1.0, fogFar: 1000 },
];
let todIdx = 0;
const tcur = {
  sky: new THREE.Color(TODS[0].sky), ground: new THREE.Color(TODS[0].ground), sunCol: new THREE.Color(TODS[0].sunCol),
  hemi: TODS[0].hemi, sun: TODS[0].sun, pos: new THREE.Vector3(...TODS[0].pos), exp: TODS[0].exp, fogFar: TODS[0].fogFar
};
const _c = new THREE.Color(), _p = new THREE.Vector3();
function updateTOD(dt) {
  const t = TODS[todIdx], k = 1 - Math.exp(-1.6 * dt), L = THREE.MathUtils.lerp;
  tcur.sky.lerp(_c.set(t.sky), k);
  tcur.ground.lerp(_c.set(t.ground), k);
  tcur.sunCol.lerp(_c.set(t.sunCol), k);
  tcur.pos.lerp(_p.set(...t.pos), k);
  tcur.hemi = L(tcur.hemi, t.hemi, k);
  tcur.sun = L(tcur.sun, t.sun, k);
  tcur.exp = L(tcur.exp, t.exp, k);
  tcur.fogFar = L(tcur.fogFar, t.fogFar, k);
  scene.background.copy(tcur.sky);
  scene.fog.color.copy(tcur.sky);
  scene.fog.far = tcur.fogFar;
  hemi.groundColor.copy(tcur.ground);
  hemi.intensity = tcur.hemi;
  sun.intensity = tcur.sun;
  sun.color.copy(tcur.sunCol);
  sun.position.copy(tcur.pos);
  renderer.toneMappingExposure = tcur.exp;
}

// ===================== CAR OBJECTS =====================
// carPivot (position + yaw) > carTilt (slope pitch/roll) > carBody (suspension-style roll/pitch)
const carPivot = new THREE.Group();
const carTilt = new THREE.Group();
const carBody = new THREE.Group();
scene.add(carPivot);
carPivot.add(carTilt);
carTilt.add(carBody);

function makeHead() {
  const s = new THREE.SpotLight(0xfff1d0, 0, 120, 0.5, 0.6, 1.5);
  carTilt.add(s, s.target);
  return s;
}
const headL = makeHead(), headR = makeHead();
const lampMat = new THREE.MeshBasicMaterial({ color: 0x555555 });
const tailMat = new THREE.MeshBasicMaterial({ color: 0x330000 });
const lampGeo = new THREE.SphereGeometry(0.09, 10, 8);
const lampFL = new THREE.Mesh(lampGeo, lampMat), lampFR = new THREE.Mesh(lampGeo, lampMat);
const tailL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.08, 0.05), tailMat), tailR = new THREE.Mesh(tailL.geometry, tailMat);
carBody.add(lampFL, lampFR, tailL, tailR);

let lightsOn = false;
function setLights(on, quiet) {
  lightsOn = on;
  headL.intensity = headR.intensity = on ? CFG.HEADLIGHT_INTENSITY : 0;
  lampMat.color.setHex(on ? 0xfff6d8 : 0x555555);
  if (!quiet) toast(on ? 'Headlights ON' : 'Headlights OFF', 1);
}

function makeBeam(color) {
  const g = new THREE.Group();
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(5, 5, 120, 16, 1, true),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.22, depthWrite: false, side: THREE.DoubleSide })
  );
  beam.position.y = 60;
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(5, 6.5, 32),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.15;
  g.add(beam, ring);
  scene.add(g);
  return g;
}

// ===================== START LINE / SPAWN =====================
let dirH = CFG.START_LINE.heading + (CFG.REVERSE_DIRECTION ? Math.PI : 0);
const line = { x: CFG.START_LINE.x, z: CFG.START_LINE.z, y: CFG.START_LINE.y, fx: Math.sin(dirH), fz: Math.cos(dirH) };
let spawn = { x: line.x - line.fx * CFG.START_BEHIND, z: line.z - line.fz * CFG.START_BEHIND, h: dirH, y: line.y };

const gas = { x: line.x + line.fx * CFG.GAS_AHEAD, z: line.z + line.fz * CFG.GAS_AHEAD, y: line.y };
const gasMarker = makeBeam(0xffd000);
gasMarker.visible = false;
gasMarker.position.set(gas.x, gas.y, gas.z);
const missionMarker = makeBeam(0x39ff6a);
missionMarker.visible = false;

// ===================== LOADERS =====================
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath(`${CDN}/examples/jsm/libs/draco/gltf/`);
const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);
let selectedMap = 'racetrack';
let selectedCar = 'tesla';
const preview = {
  car: { scene: new THREE.Scene(), camera: new THREE.PerspectiveCamera(28, 640 / 360, 0.1, 1000), root: new THREE.Group(), renderer: new THREE.WebGLRenderer({ canvas: $('carPreview'), alpha: true, antialias: true }) },
  maps: {}
};

// ---- minimap bake (top-down render of the racetrack, done once) ----
let mapCanvas = null;
const map = { cx: 0, cz: 0, extent: 1000 };
function bakeMap(root) {
  try {
    const box = trackBox;
    const size = box.getSize(new THREE.Vector3());
    const ctr = box.getCenter(new THREE.Vector3());
    const extent = Math.min(Math.max(size.x, size.z) * 1.02, CFG.MAP_MAX_EXTENT);
    const N = CFG.MAP_BAKE_SIZE;

    const cam = new THREE.OrthographicCamera(-extent / 2, extent / 2, extent / 2, -extent / 2, 1, size.y + 500);
    cam.up.set(0, 0, -1);                       // image top = world -Z
    cam.position.set(ctr.x, box.max.y + 250, ctr.z);
    cam.lookAt(ctr.x, 0, ctr.z);
    cam.updateMatrixWorld();

    const rt = new THREE.WebGLRenderTarget(N, N);
    const prev = { bg: scene.background, near: scene.fog.near, far: scene.fog.far,
                   car: carPivot.visible, gas: gasMarker.visible, mis: missionMarker.visible };
    scene.background = new THREE.Color(0x3b6e3c);
    scene.fog.near = 1e6; scene.fog.far = 2e6;
    carPivot.visible = gasMarker.visible = missionMarker.visible = false;

    renderer.setRenderTarget(rt);
    renderer.render(scene, cam);
    const buf = new Uint8Array(N * N * 4);
    renderer.readRenderTargetPixels(rt, 0, 0, N, N, buf);
    renderer.setRenderTarget(null);
    rt.dispose();

    scene.background = prev.bg; scene.fog.near = prev.near; scene.fog.far = prev.far;
    carPivot.visible = prev.car; gasMarker.visible = prev.gas; missionMarker.visible = prev.mis;

    const lut = new Uint8ClampedArray(256);
    for (let i = 0; i < 256; i++) lut[i] = Math.pow(i / 255, 1 / 2.2) * 255;   // render target is linear
    const img = new ImageData(N, N);
    for (let y = 0; y < N; y++) {
      let s = (N - 1 - y) * N * 4, d = y * N * 4;
      for (let x = 0; x < N; x++, s += 4, d += 4) {
        img.data[d] = lut[buf[s]]; img.data[d + 1] = lut[buf[s + 1]]; img.data[d + 2] = lut[buf[s + 2]]; img.data[d + 3] = 255;
      }
    }
    mapCanvas = document.createElement('canvas');
    mapCanvas.width = mapCanvas.height = N;
    mapCanvas.getContext('2d').putImageData(img, 0, 0);
    map.cx = ctr.x; map.cz = ctr.z; map.extent = extent;
  } catch (e) { console.error('Minimap bake failed', e); toast('Minimap bake failed (see console)'); }
}

// ---- ground height grid (so the car follows hills, with surface types) ----
// surface: 0 = road/kerb, 1 = grass/other, 2 = gravel/sand
const ROAD_RE = /^(ROAD|RDLINE|SFLINE|RMBL|SKIDMARK|GROOVE|PSROAD|LINE)/i;
const GRAVEL_RE = /^(GRVL|SAND)/i;
const JOB_ROAD_RE = /^(ROADCONC0[124]|ROAD5|ROADB258)/i;
const ground = { ready: false, cell: 8, x0: 0, z0: 0, nx: 0, nz: 0, start: null, ids: null, tris: null, surf: null, floorY: -100 };
let roadPts = [];     // sampled road points for delivery jobs
let gSurf = 1;        // surface type of the last groundHeight() hit

async function buildGround(root) {
  const items = [];
  let maxTris = 0;
  root.traverse((o) => {
    if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
    let skip = /cone/i.test(o.name);
    o.traverseAncestors((a) => { if (/cone/i.test(a.name)) skip = true; });
    if (skip) return;
    const g = o.geometry;
    maxTris += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
    items.push(o);
  });
  const tris = new Float32Array(maxTris * 9);
  const surf = new Uint8Array(maxTris);
  let n = 0, work = 0, rc = 0;
  roadPts = [];

  for (const o of items) {
    const g = o.geometry, pos = g.attributes.position, idx = g.index ? g.index.array : null;
    const e = o.matrixWorld.elements, vc = pos.count;
    const wv = new Float32Array(vc * 3);
    for (let i = 0; i < vc; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      wv[i * 3]     = e[0] * x + e[4] * y + e[8]  * z + e[12];
      wv[i * 3 + 1] = e[1] * x + e[5] * y + e[9]  * z + e[13];
      wv[i * 3 + 2] = e[2] * x + e[6] * y + e[10] * z + e[14];
    }
    const mat = Array.isArray(o.material) ? o.material[0] : o.material;
    const mn = (mat && mat.name) || '';
    const type = ROAD_RE.test(mn) ? 0 : (GRAVEL_RE.test(mn) ? 2 : 1);
    const jobRoad = JOB_ROAD_RE.test(mn);
    const tc = idx ? idx.length / 3 : vc / 3;

    for (let t = 0; t < tc; t++) {
      const a3 = (idx ? idx[t * 3] : t * 3) * 3, b3 = (idx ? idx[t * 3 + 1] : t * 3 + 1) * 3, c3 = (idx ? idx[t * 3 + 2] : t * 3 + 2) * 3;
      const ax = wv[a3], ay = wv[a3 + 1], az = wv[a3 + 2];
      const bx = wv[b3], by = wv[b3 + 1], bz = wv[b3 + 2];
      const cx = wv[c3], cy = wv[c3 + 1], cz = wv[c3 + 2];
      const ux = bx - ax, uy = by - ay, uz = bz - az, vx = cx - ax, vy = cy - ay, vz = cz - az;
      const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      if (len > 1e-9 && Math.abs(ny) / len >= 0.55) {          // keep roughly horizontal surfaces (either winding)
        const o9 = n * 9;
        tris[o9] = ax; tris[o9 + 1] = ay; tris[o9 + 2] = az;
        tris[o9 + 3] = bx; tris[o9 + 4] = by; tris[o9 + 5] = bz;
        tris[o9 + 6] = cx; tris[o9 + 7] = cy; tris[o9 + 8] = cz;
        surf[n] = type;
        if (jobRoad && (rc++ % 5 === 0) && roadPts.length < 30000) roadPts.push([(ax + bx + cx) / 3, (ay + by + cy) / 3, (az + bz + cz) / 3]);
        n++;
      }
      if ((++work & 0x7FFF) === 0) await new Promise((r) => setTimeout(r, 0));   // keep the page responsive
    }
  }

  // bounds
  let minX = Infinity, minZ = Infinity, maxX = -Infinity, maxZ = -Infinity;
  for (let t = 0; t < n; t++) {
    const o9 = t * 9;
    for (let k = 0; k < 9; k += 3) {
      const x = tris[o9 + k], z = tris[o9 + k + 2];
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    }
  }
  const cell = ground.cell;
  const nx = Math.ceil((maxX - minX) / cell) + 1, nz = Math.ceil((maxZ - minZ) / cell) + 1;
  const counts = new Int32Array(nx * nz + 1);
  const range = (t, out) => {
    const o9 = t * 9;
    const x0 = Math.min(tris[o9], tris[o9 + 3], tris[o9 + 6]), x1 = Math.max(tris[o9], tris[o9 + 3], tris[o9 + 6]);
    const z0 = Math.min(tris[o9 + 2], tris[o9 + 5], tris[o9 + 8]), z1 = Math.max(tris[o9 + 2], tris[o9 + 5], tris[o9 + 8]);
    out[0] = Math.floor((x0 - minX) / cell); out[1] = Math.floor((x1 - minX) / cell);
    out[2] = Math.floor((z0 - minZ) / cell); out[3] = Math.floor((z1 - minZ) / cell);
  };
  const r = [0, 0, 0, 0];
  for (let t = 0; t < n; t++) {
    range(t, r);
    for (let iz = r[2]; iz <= r[3]; iz++) for (let ix = r[0]; ix <= r[1]; ix++) counts[iz * nx + ix + 1]++;
  }
  for (let i = 0; i < nx * nz; i++) counts[i + 1] += counts[i];
  const start = counts;                              // CSR offsets
  const fill = start.slice(0, nx * nz);
  const ids = new Int32Array(start[nx * nz]);
  for (let t = 0; t < n; t++) {
    range(t, r);
    for (let iz = r[2]; iz <= r[3]; iz++) for (let ix = r[0]; ix <= r[1]; ix++) ids[fill[iz * nx + ix]++] = t;
  }
  Object.assign(ground, { x0: minX, z0: minZ, nx, nz, start, ids, tris, surf, ready: true });
  console.log(`Ground grid: ${n} triangles, ${ids.length} cell refs, ${roadPts.length} road samples`);
}

// highest surface at (x,z) that is at or below yMax (so roofs/bridges above the car are ignored)
function groundHeight(x, z, yMax) {
  if (!ground.ready) return -Infinity;
  const ix = Math.floor((x - ground.x0) / ground.cell), iz = Math.floor((z - ground.z0) / ground.cell);
  if (ix < 0 || iz < 0 || ix >= ground.nx || iz >= ground.nz) return -Infinity;
  const ci = iz * ground.nx + ix, T = ground.tris;
  let best = -Infinity;
  for (let k = ground.start[ci], e = ground.start[ci + 1]; k < e; k++) {
    const t = ground.ids[k], o = t * 9;
    const ax = T[o], az = T[o + 2], bx = T[o + 3], bz = T[o + 5], cx = T[o + 6], cz = T[o + 8];
    const d = (bz - cz) * (ax - cx) + (cx - bx) * (az - cz);
    if (d === 0) continue;
    const l1 = ((bz - cz) * (x - cx) + (cx - bx) * (z - cz)) / d;
    const l2 = ((cz - az) * (x - cx) + (ax - cx) * (z - cz)) / d;
    const l3 = 1 - l1 - l2;
    if (l1 < -1e-4 || l2 < -1e-4 || l3 < -1e-4) continue;
    const y = l1 * T[o + 1] + l2 * T[o + 4] + l3 * T[o + 7];
    if (y <= yMax && y > best) { best = y; gSurf = ground.surf[t]; }
  }
  return best;
}

function findRoadSpawn(box) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const groundLimit = box.min.y + Math.max(20, size.y * 0.12);
  let fallback = null;
  let best = null;
  let bestScore = Infinity;
  const step = Math.max(12, Math.min(size.x, size.z) / 32);
  for (let x = box.min.x + step; x < box.max.x; x += step) {
    for (let z = box.min.z + step; z < box.max.z; z += step) {
      const y = groundHeight(x, z, groundLimit);
      if (y === -Infinity) continue;
      const candidate = { x, z, y };
      if (!fallback || y < fallback.y) fallback = candidate;
      const distance = Math.hypot(x - center.x, z - center.z);
      const score = (gSurf === 0 ? 0 : 100000) + distance;
      if (score < bestScore) { best = candidate; bestScore = score; }
    }
  }
  if (!best && !fallback) {
    for (let x = box.min.x + step; x < box.max.x; x += step) {
      for (let z = box.min.z + step; z < box.max.z; z += step) {
        const y = groundHeight(x, z, box.max.y + 10);
        if (y > -Infinity && (!fallback || y < fallback.y)) fallback = { x, z, y };
      }
    }
  }
  return best || fallback;
}

function loadSelectedAssets() {
trackReady = false; carReady = false; wallBoxes.length = 0;
setStatus(`Loading ${selectedMap === 'city' ? 'city.glb' : 'racetrack.glb'}...`);
loader.load(CFG.TRACK_FILE, (gltf) => {
  racetrack = gltf.scene;
  racetrack.updateMatrixWorld(true);
  trackBox.setFromObject(racetrack);
  if (selectedMap === 'city') {
    const center = trackBox.getCenter(new THREE.Vector3());
    CFG.START_LINE.x = center.x; CFG.START_LINE.z = center.z; CFG.START_LINE.y = trackBox.min.y;
    CFG.START_LINE.heading = 0;
    dirH = 0; line.x = center.x; line.z = center.z; line.y = trackBox.min.y; line.fx = 0; line.fz = 1;
    spawn = { x: center.x, z: center.z - CFG.START_BEHIND, h: 0, y: trackBox.min.y };
    gas.x = center.x; gas.z = center.z + CFG.GAS_AHEAD; gas.y = trackBox.min.y;
  }
  const wallRe = /wall|barrier|fence|guard|rail|block|concrete/i;
  racetrack.traverse((o) => {
    if (!o.isMesh || !o.geometry) return;
    const label = `${o.name} ${(o.material && o.material.name) || ''}`;
    if (/sign|cone|light|lamp|post|pole|marker|flag/i.test(label)) return;
    const position = o.geometry.attributes.position;
    const index = o.geometry.index;
    const e = o.matrixWorld.elements;
    const read = (i, out) => {
      const x = position.getX(i), y = position.getY(i), z = position.getZ(i);
      out.set(
        e[0] * x + e[4] * y + e[8] * z + e[12],
        e[1] * x + e[5] * y + e[9] * z + e[13],
        e[2] * x + e[6] * y + e[10] * z + e[14]
      );
    };
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    const ab = new THREE.Vector3(), ac = new THREE.Vector3(), normal = new THREE.Vector3();
    const triCount = index ? index.count / 3 : position.count / 3;
    for (let t = 0; t < triCount; t++) {
      const ia = index ? index.getX(t * 3) : t * 3;
      const ib = index ? index.getX(t * 3 + 1) : t * 3 + 1;
      const ic = index ? index.getX(t * 3 + 2) : t * 3 + 2;
      read(ia, a); read(ib, b); read(ic, c);
      ab.subVectors(b, a); ac.subVectors(c, a); normal.crossVectors(ab, ac);
      const normalLength = normal.length();
      const height = Math.max(a.y, b.y, c.y) - Math.min(a.y, b.y, c.y);
      const width = Math.max(
        Math.max(a.x, b.x, c.x) - Math.min(a.x, b.x, c.x),
        Math.max(a.z, b.z, c.z) - Math.min(a.z, b.z, c.z)
      );
      if (normalLength < 1e-5 || Math.abs(normal.y / normalLength) > 0.6 || height < 0.35 || width < 0.08) continue;
      const triBox = new THREE.Box3().setFromPoints([a, b, c]).expandByScalar(0.02);
      if (wallRe.test(label)) wallBoxes.push(triBox);
    }
  });
  fallbackGrass.position.y = trackBox.min.y - 1;
  ground.floorY = trackBox.min.y - 1;
  scene.add(racetrack);
  setStatus('Baking minimap...');
  requestAnimationFrame(() => setTimeout(async () => {
    bakeMap(racetrack);
    setStatus('Building ground collision...');
    await buildGround(racetrack);
    if (selectedMap === 'city') {
      const citySpawn = findRoadSpawn(trackBox);
      if (citySpawn) {
        line.x = citySpawn.x; line.z = citySpawn.z; line.y = citySpawn.y;
        spawn = { x: citySpawn.x, z: citySpawn.z, h: 0, y: citySpawn.y };
        gas.x = citySpawn.x; gas.z = citySpawn.z + CFG.GAS_AHEAD; gas.y = citySpawn.y;
      }
    }
    // static scenery: stop per-frame matrix updates (hundreds of meshes)
    racetrack.traverse((o) => { o.matrixAutoUpdate = false; });
    racetrack.matrixWorldAutoUpdate = false;
    // place markers on the road
    const g = groundHeight(gas.x, gas.z, line.y + 3);
    gas.y = g > -Infinity ? g : line.y;
    gasMarker.position.set(gas.x, gas.y, gas.z);
    trackReady = true; checkReady();
  }, 30));
}, (xhr) => {
  setStatus(xhr.lengthComputable ? `Loading racetrack.glb ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`
                                  : `Loading racetrack.glb ${(xhr.loaded / 1048576).toFixed(0)} MB`);
}, (err) => { console.error(err); setStatus('Error loading racetrack.glb (check filename)'); });

const PAINTS = [
  { n: 'Original' }, { n: 'Red', c: 0xd0121a }, { n: 'Orange', c: 0xff6a00 }, { n: 'Yellow', c: 0xf4c20d },
  { n: 'Green', c: 0x1f9d3a }, { n: 'Blue', c: 0x1560ff }, { n: 'Purple', c: 0x7a2bd6 },
  { n: 'White', c: 0xf2f2f2 }, { n: 'Black', c: 0x0c0c0c }
];

function applyPaint(i) {

    if (i === 0) m.color.copy(m.userData.origColor); else m.color.setHex(PAINTS[i].c);
  });
}
function cyclePaint() {

loader.load(CFG.CAR_FILE, (gltf) => {
  const carModel = gltf.scene;

  // auto-orient: if the car is longer along X, turn it so length runs along Z
  let b0 = new THREE.Box3().setFromObject(carModel), s0 = b0.getSize(new THREE.Vector3());
  if (s0.x > s0.z) carModel.rotation.y = -Math.PI / 2;
  carModel.rotation.y += CFG.CAR_YAW_FIX;

  const box = new THREE.Box3().setFromObject(carModel);
  const size = new THREE.Vector3(); box.getSize(size);
  carModel.scale.setScalar(CFG.CAR_LENGTH / Math.max(size.x, size.y, size.z));

  const sb = new THREE.Box3().setFromObject(carModel);
  const ctr = new THREE.Vector3(); sb.getCenter(ctr);
  carModel.position.x -= ctr.x;
  carModel.position.z -= ctr.z;
  carModel.position.y -= sb.min.y;

  // lamp / headlight placement from the final bounding box
  const fs = new THREE.Box3().setFromObject(carModel).getSize(new THREE.Vector3());
  const hl = fs.z / 2, hw = fs.x / 2, h = fs.y;
  lampFL.position.set( hw * 0.62, h * 0.45,  hl * 0.92);
  lampFR.position.set(-hw * 0.62, h * 0.45,  hl * 0.92);
  tailL.position.set(  hw * 0.60, h * 0.55, -hl * 0.97);
  tailR.position.set( -hw * 0.60, h * 0.55, -hl * 0.97);
  headL.position.set( hw * 0.62, h * 0.45, hl * 0.9); headL.target.position.set( hw * 0.62, 0, hl + 30);
  headR.position.set(-hw * 0.62, h * 0.45, hl * 0.9); headR.target.position.set(-hw * 0.62, 0, hl + 30);

  // find body-paint materials (heuristic; names are logged so you can refine it)
  const BODY = /body|paint|exterior|carpaint|shell|bodywork|chassis|main/i;
  const EXCL = /glass|window|wheel|tire|tyre|rim|light|lamp|interior|brake|disc|caliper|calliper|logo|badge|mirror|grill|plastic|rubber|chrome|carbon|seat|dash|black/i;
  const names = new Set(), cand = new Set(); let biggest = null, bigVol = 0;
  const tmp = new THREE.Vector3();
  carModel.traverse((o) => {
    if (!o.isMesh) return;
    const bs = new THREE.Box3().setFromObject(o).getSize(tmp);
    const vol = bs.x * bs.y * bs.z;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
      if (!m || !m.color) return;
      names.add(m.name);
      if (EXCL.test(m.name || '') || m.transparent) return;
      if (BODY.test(m.name || '')) cand.add(m);
      if (vol > bigVol) { bigVol = vol; biggest = m; }
    });
  });

// ===================== AUDIO (WebAudio, no files) =====================
let actx, master, eng1, eng2, engFilter, engGain, noiseGain, hornGain;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(actx.destination);
    engFilter = actx.createBiquadFilter(); engFilter.type = 'lowpass'; engFilter.frequency.value = 900;
    engGain = actx.createGain(); engGain.gain.value = 0;
    eng1 = actx.createOscillator(); eng1.type = 'sawtooth';
    eng2 = actx.createOscillator(); eng2.type = 'square';
    eng1.connect(engFilter); eng2.connect(engFilter); engFilter.connect(engGain); engGain.connect(master);
    eng1.start(); eng2.start();

    const nb = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const ns = actx.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 1.2;
    noiseGain = actx.createGain(); noiseGain.gain.value = 0;
    ns.connect(bp); bp.connect(noiseGain); noiseGain.connect(master); ns.start();

    hornGain = actx.createGain(); hornGain.gain.value = 0; hornGain.connect(master);
    [392, 440].forEach((f) => { const o = actx.createOscillator(); o.type = 'square'; o.frequency.value = f; o.connect(hornGain); o.start(); });
  } catch (e) { console.warn('Audio init failed', e); actx = null; }
}
function updateAudio() {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime, f = 28 + car.rpm * 0.032;
  eng1.frequency.setTargetAtTime(f, t, 0.05);
  eng2.frequency.setTargetAtTime(f * 0.5, t, 0.05);
  engFilter.frequency.setTargetAtTime(500 + car.rpm * 0.25 + car.throttle * 600, t, 0.05);
  engGain.gain.setTargetAtTime(0.035 + car.throttle * 0.05, t, 0.08);
  noiseGain.gain.setTargetAtTime(car.squeal, t, 0.05);
  hornGain.gain.setTargetAtTime(keys.KeyH ? 0.06 : 0, t, 0.02);
}

// ===================== PHYSICS STEP =====================
function hitsWall(x, z) {
  const radius = 0.3;
  for (const box of wallBoxes) {
    if (car.y + 2 < box.min.y || car.y > box.max.y + 1) continue;
    const px = THREE.MathUtils.clamp(x, box.min.x, box.max.x);
    const pz = THREE.MathUtils.clamp(z, box.min.z, box.max.z);
    if ((x - px) ** 2 + (z - pz) ** 2 < radius ** 2) return true;
  }
  return false;
}
function stepCar(dt) {
  if (!ground.ready || !trackReady) {                   // hold the car until the ground grid exists
    car.throttle = 0;
    carPivot.position.set(car.x, car.y, car.z); carPivot.rotation.y = car.h;
    return;
  }
  const up = keys.KeyW || keys.ArrowUp, down = keys.KeyS || keys.ArrowDown;
  const hand = driftEnabled && !!keys.Space;
  const steerIn = ((keys.KeyA || keys.ArrowLeft) ? 1 : 0) - ((keys.KeyD || keys.ArrowRight) ? 1 : 0);
  const throttle = up ? 1 : 0;
  car.throttle = throttle;
  const surf = car.surf;

  // steering -> yaw (speed sensitive)
  car.steer += (steerIn - car.steer) * (1 - Math.exp(-7 * dt));
  const sp = Math.abs(car.vf);
  let yaw = car.steer * 1.7 * Math.min(sp / 8, 1) / (1 + (sp / 45) ** 2);
  const driftActive = hand && sp > 8 && Math.abs(steerIn) > 0;
  if (driftActive) yaw *= 1.75;
  car.h += yaw * Math.sign(car.vf || 1) * dt;

  // car-frame velocity
  const fx = Math.sin(car.h), fz = Math.cos(car.h), rx = -Math.cos(car.h), rz = Math.sin(car.h);
  let vf = car.vx * fx + car.vz * fz;
  let vl = car.vx * rx + car.vz * rz;
  const prevVf = vf;

  // auto gearbox
  car.shift = Math.max(0, car.shift - dt);
  car.shiftCd = Math.max(0, car.shiftCd - dt);
  if (car.auto && vf > -0.5 && car.shiftCd <= 0) {
    const g = car.gear;
    if (g < 5 && vf > GEAR_MAX[g - 1] * (0.75 + 0.2 * throttle)) { car.gear++; car.shift = 0.2; car.shiftCd = 0.45; }
    else if (g > 1 && vf < GEAR_MAX[g - 2] * 0.55) { car.gear--; car.shiftCd = 0.3; }
  }

  // longitudinal
  const gm = GEAR_MAX[car.gear - 1];
  let braking = false, applied = true;
  if (throttle) {
    if (vf < -0.5) { vf += 24 * dt; braking = true; }
    else if (car.shift <= 0) {
      if (vf <= gm) {
        const ratio = Math.max(vf, 0) / gm;
        const a = GEAR_ACC[car.gear - 1] * torque(ratio) * (ratio < 0.12 ? 0.6 : 1) * accelMult();
        vf = Math.min(vf + a * dt, gm);
      } else vf -= 18 * dt;                    // over-rev engine braking (manual downshift)
    } else applied = false;                    // clutch in during shift
  } else if (down) {
    if (vf > 0.5) { vf -= 24 * dt; braking = true; }
    else if (car.shift <= 0) vf = Math.max(vf - 4.5 * dt, -REV_MAX);
    else applied = false;
  } else applied = false;

  if (!applied) {                              // coasting drag
    const d = (0.7 + 0.0003 * vf * vf) * dt;
    vf -= Math.sign(vf) * Math.min(Math.abs(vf), d);
  }
  if (hand) {
    vf -= Math.sign(vf) * Math.min(Math.abs(vf), 3.5 * dt);
    braking = true;
  }
  car.braking = braking;

  // off-track drag (grass / gravel) and hill slope
  if (surf) {
    const d = (surf === 2 ? 5 + 0.25 * Math.abs(vf) : 1.5 + 0.08 * Math.abs(vf)) * dt;
    vf -= Math.sign(vf) * Math.min(Math.abs(vf), d);
  }
  if (car.grounded) vf -= 4.9 * THREE.MathUtils.clamp(car.slope, -0.4, 0.4) * dt;

  // lateral grip (handbrake = slide, off-track = less grip)
  const grip = driftActive ? 0.18 : (hand && sp > 3 ? 0.5 : (surf === 0 ? 9 : surf === 1 ? 5.5 : 3.5));
  vl *= Math.exp(-grip * dt);
  if (driftActive) vl += steerIn * Math.abs(vf) * 1.35 * dt;

  // integrate
  car.vx = fx * vf + rx * vl;
  car.vz = fz * vf + rz * vl;
  const nextX = car.x + car.vx * dt, nextZ = car.z + car.vz * dt;
  if (!hitsWall(car.x, car.z) && hitsWall(nextX, nextZ)) {
    car.vx = 0; car.vz = 0; vf = 0; vl = 0;
    if (performance.now() - wallToastAt > 900) {
      wallToastAt = performance.now();
      toast('Wall impact — vehicle stopped', 0.7);
    }
  } else {
    car.x = nextX; car.z = nextZ;
  }
  car.vf = vf; car.vl = vl;
  car.ax += (((vf - prevVf) / Math.max(dt, 1e-4)) - car.ax) * (1 - Math.exp(-6 * dt));

  // ---- ground following ----
  const tol = 0.45 + Math.abs(vf) * dt * 0.25;
  const gh = groundHeight(car.x, car.z, car.y + tol);
  if (gh > -Infinity) {
    car.surf = gSurf; car.noGround = 0;
    const stick = 0.3 + Math.abs(vf) * dt * 0.25;
    if (car.grounded) {
      if (car.y - gh <= stick) { car.y = gh; car.vy = 0; } else car.grounded = false;
    }
    if (!car.grounded) {
      car.vy -= 9.81 * dt; car.y += car.vy * dt;
      if (car.y <= gh) { car.y = gh; car.vy = 0; car.grounded = true; }
    }
  } else {
    car.grounded = false; car.vy -= 9.81 * dt; car.y += car.vy * dt;
    car.noGround += dt;
    if (car.noGround > 1.5) { toast('Off the map - back to the start', 2.5); resetCar(); return; }
  }
  let tPitch = car.tiltP, tRoll = car.tiltR;
  if (car.grounded) {
    const gfx = Math.sin(car.h), gfz = Math.cos(car.h), glx = Math.cos(car.h), glz = -Math.sin(car.h);
    const ref = car.y + 0.5, sv = gSurf;
    const q = (x, z) => { const h = groundHeight(x, z, ref); return h > -Infinity ? h : car.y; };
    const hF = q(car.x + gfx * 1.5, car.z + gfz * 1.5), hB = q(car.x - gfx * 1.4, car.z - gfz * 1.4);
    const hL = q(car.x + glx * 0.85, car.z + glz * 0.85), hR = q(car.x - glx * 0.85, car.z - glz * 0.85);
    gSurf = sv;
    tPitch = Math.atan2(hF - hB, 2.9); tRoll = Math.atan2(hL - hR, 1.7);
    car.slope = (hF - hB) / 2.9;
  }
  const kt = 1 - Math.exp(-12 * dt);
  car.tiltP += (tPitch - car.tiltP) * kt;
  car.tiltR += (tRoll - car.tiltR) * kt;

  // RPM
  let ratio = vf < -0.3 ? -vf / REV_MAX : Math.max(vf, 0) / GEAR_MAX[car.gear - 1];
  let r01 = ratio + (ratio < 0.3 ? (1 - ratio) * throttle * 0.12 : 0);
  if (!car.auto && throttle && ratio >= 0.995) r01 = 0.97 + Math.random() * 0.03;   // rev limiter
  r01 = THREE.MathUtils.clamp(r01, 0, 1);
  car.rpm += (IDLE + r01 * (REDLINE - IDLE) - car.rpm) * (1 - Math.exp(-14 * dt));

  // drift scoring (on tarmac only)
  const slip = Math.abs(vl), drifting = car.surf === 0 && slip > 4.5 && Math.abs(vf) > 10;
  if (drifting) { car.driftPts += slip * Math.abs(vf) * 0.06 * dt; car.driftGap = 0; }
  else if (car.driftPts > 0) {
    car.driftGap += dt;
    if (car.driftGap > 1.0) {
      if (car.driftPts >= 20) toast(`Drift ${Math.floor(car.driftPts)} points`, 1.5);
      car.driftPts = 0;
    }
  }
  car.squeal = THREE.MathUtils.clamp((slip - 3) / 8, 0, 1) * 0.08 + (braking && vf > 15 ? 0.03 : 0);

  // lap timing (start/finish line crossing in the driving direction)
  const ls = lapS();
  const lrx = car.x - line.x, lrz = car.z - line.z;
  const across = Math.abs(lrx * -line.fz + lrz * line.fx);
  if (lap.running) { lap.t += dt; lap.maxDist = Math.max(lap.maxDist, Math.hypot(lrx, lrz)); }
  if (lap.prevS < 0 && ls >= 0 && across < 16) {
    if (!lap.running) { lap.running = true; lap.t = 0; lap.maxDist = 0; toast('Lap started!', 1.5); }
    else if (lap.maxDist > CFG.MIN_LAP_DIST && lap.t > 20) {
      lap.last = lap.t; lap.count++;
      const isBest = !save.best || lap.t < save.best;
      if (isBest) save.best = lap.t;
      toast(`Lap ${lap.count}: ${fmtTime(lap.t)}${isBest ? '  NEW BEST!' : ''}`, 4);
      lap.t = 0; lap.maxDist = 0;
    }
  }
  lap.prevS = ls;

  // delivery job
  if (mission.on) {
    mission.t -= dt;
    const d = Math.hypot(mission.x - car.x, mission.z - car.z);
    if (d < 9) {
      mission.on = false; missionMarker.visible = false;
      toast('Delivered!', 3);
    } else if (mission.t <= 0) {
      mission.on = false; missionMarker.visible = false; toast("Time's up - job failed", 3);
    }
  }

  // apply to meshes
  carPivot.position.set(car.x, car.y, car.z);
  carPivot.rotation.y = car.h;
  carTilt.rotation.x = -car.tiltP;
  carTilt.rotation.z = car.tiltR;
  const kb = 1 - Math.exp(-8 * dt);
  carBody.rotation.z += (car.steer * Math.min(sp / 40, 1) * 0.05 - carBody.rotation.z) * kb;
  carBody.rotation.x += (-THREE.MathUtils.clamp(car.ax, -20, 20) * 0.004 - carBody.rotation.x) * kb;
  tailMat.color.setHex(braking ? 0xff2a2a : (lightsOn ? 0x991111 : 0x330000));
}

  const speed01 = THREE.MathUtils.clamp(Math.abs(car.vf) / GEAR_MAX[4], 0, 1);
  const k = (r) => 1 - Math.exp(-r * dt);
  carBody.visible = !(camMode === 1 && hideBody);

  if (camMode === 0) {
    const c = CFG.CHASE;
    _v1.set(c[0], c[1] + speed01 * 0.4, c[2] - speed01 * 2.0);
    carPivot.localToWorld(_v1);
    if (camSnap) { camera.position.copy(_v1); camSnap = false; } else camera.position.lerp(_v1, k(9));
    keepAboveGround();
    _v2.set(0, 1.0, 2.0); carPivot.localToWorld(_v2);
    camera.lookAt(_v2);
  } else if (camMode === 1) {
    const c = CFG.COCKPIT;
    _v1.set(c[0], c[1], c[2]); carTilt.localToWorld(_v1);
    camera.position.copy(_v1);
    _v2.set(c[0] + car.steer * 5, c[1] - 0.02, c[2] + 20); carTilt.localToWorld(_v2);
    camera.lookAt(_v2);
    camSnap = false;
  } else {
    const c = CFG.SIDE;
    _v1.set(c[0], c[1], c[2]); carPivot.localToWorld(_v1);
    if (camSnap) { camera.position.copy(_v1); camSnap = false; } else camera.position.lerp(_v1, k(10));
    keepAboveGround();
    _v2.set(0, 0.8, 0.3); carPivot.localToWorld(_v2);
    camera.lookAt(_v2);
  }

  const fovTarget = (camMode === 1 ? 75 : 65) + speed01 * 12;
  fovCur += (fovTarget - fovCur) * k(5);
  if (Math.abs(camera.fov - fovCur) > 0.05) { camera.fov = fovCur; camera.updateProjectionMatrix(); }
}

// ===================== MINIMAP =====================
const mm = $('minimap'), mctx = mm.getContext('2d'), MM = 200, R = MM / 2;
function drawMinimap() {
  mctx.clearRect(0, 0, MM, MM);
  mctx.save();
  mctx.beginPath(); mctx.arc(R, R, R, 0, Math.PI * 2); mctx.clip();
  mctx.fillStyle = '#2b3d2b'; mctx.fillRect(0, 0, MM, MM);

  const theta = car.h - Math.PI;                 // rotate so the car always points up
  const dpm = MM / ZOOMS[mapZoomIdx];            // screen px per meter
  if (mapCanvas) {
    const s = dpm * (map.extent / mapCanvas.width);
    const px = ((car.x - map.cx) / map.extent + 0.5) * mapCanvas.width;
    const py = ((car.z - map.cz) / map.extent + 0.5) * mapCanvas.height;
    mctx.imageSmoothingQuality = 'high';
    mctx.translate(R, R); mctx.rotate(theta); mctx.scale(s, s);
    mctx.drawImage(mapCanvas, -px, -py);
  }
  mctx.restore();

  const c = Math.cos(theta), s = Math.sin(theta);
  const marker = (wx, wz, draw) => {
    const dx = (wx - car.x) * dpm, dy = (wz - car.z) * dpm;
    let x = dx * c - dy * s, y = dx * s + dy * c;
    const d = Math.hypot(x, y), lim = R - 10;
    if (d > lim) { x *= lim / d; y *= lim / d; }
    mctx.save(); mctx.translate(R + x, R + y); draw(); mctx.restore();
  };
  marker(line.x, line.z, () => {
    mctx.fillStyle = '#fff'; mctx.fillRect(-6, -6, 12, 12);
    mctx.fillStyle = '#000'; mctx.font = 'bold 10px sans-serif'; mctx.textAlign = 'center'; mctx.textBaseline = 'middle'; mctx.fillText('S', 0, 1);
  });
  if (mission.on) marker(mission.x, mission.z, () => {
    mctx.fillStyle = '#39ff6a'; mctx.strokeStyle = '#fff'; mctx.lineWidth = 2;
    mctx.beginPath(); mctx.arc(0, 0, 7, 0, 6.2832); mctx.fill(); mctx.stroke();
  });

  // north marker
  mctx.fillStyle = '#fff'; mctx.font = 'bold 12px sans-serif'; mctx.textAlign = 'center'; mctx.textBaseline = 'middle';
  mctx.fillText('N', R + (R - 11) * Math.sin(theta), R - (R - 11) * Math.cos(theta));

  // player pointer
  mctx.save(); mctx.translate(R, R);
  mctx.fillStyle = '#ff6a00'; mctx.strokeStyle = '#fff'; mctx.lineWidth = 2;
  mctx.beginPath(); mctx.moveTo(0, -11); mctx.lineTo(8, 9); mctx.lineTo(0, 4); mctx.lineTo(-8, 9); mctx.closePath();
  mctx.fill(); mctx.stroke(); mctx.restore();
}

// ===================== HUD =====================
let hudT = 0;
function updateHUD(dt) {
  hudT += dt; if (hudT < 0.066) return; hudT = 0;
  const speedKmh = Math.round(Math.hypot(car.vx, car.vz) * 3.6);
  $('speedReadout').innerHTML = `${speedKmh}<small>KM/H</small>`;
  const speedRatio = THREE.MathUtils.clamp(speedKmh / 330, 0, 1);
  $('speedFill').style.transform = `translateX(-50%) rotate(${-42 + speedRatio * 264}deg)`;
  $('gear').textContent = car.vf < -0.3 ? 'R' : (Math.abs(car.vf) < 0.3 && !car.throttle ? 'N' : car.gear);
  const r = (car.rpm - IDLE) / (REDLINE - IDLE);
  const rb = $('rpmBar'); rb.style.width = (r * 100).toFixed(0) + '%'; rb.className = r > 0.9 ? 'red' : '';
  $('rpmTxt').textContent = `${Math.round(car.rpm)} RPM`;
  $('surface').textContent = !car.grounded ? 'AIRBORNE' : (car.surf === 2 ? 'GRAVEL' : (car.surf === 1 ? 'OFF TRACK' : ''));
  $('lap').textContent = lap.running ? `Lap ${lap.count + 1}  ${fmtTime(lap.t)}` : 'Cross the start line to begin a lap';
  $('lapBest').textContent = `Last ${lap.last ? fmtTime(lap.last) : '--'}  |  Best ${save.best ? fmtTime(save.best) : '--'}`;
  $('timeTxt').textContent = `Time: ${TODS[todIdx].name} | Quality ${CFG.QUALITY}p`;
  const dEl = $('drift');
  if (car.driftPts > 5) { dEl.style.display = 'block'; dEl.textContent = `DRIFT ${Math.floor(car.driftPts)}`; } else dEl.style.display = 'none';
}

// ===================== DYNAMIC RESOLUTION (keeps iGPU framerate up) =====================
let fpsAcc = 0, fpsN = 0, fpsT = 0, fpsFrames = 0, fpsClock = 0;
function adaptResolution(dt) {
  if (!readyAt || performance.now() - readyAt < 4000) return;      // ignore load hitches
  fpsAcc += dt; fpsN++; fpsT += dt;
  if (fpsT < 2) return;
  const avg = fpsAcc / fpsN; fpsAcc = 0; fpsN = 0; fpsT = 0;
  let np = pixelRatio;
  if (avg > 1 / 40) np = Math.max(CFG.MIN_PIXEL_RATIO, pixelRatio - 0.15);                      // slower than ~40 fps
  else if (avg < 1 / 57) np = Math.min(Math.min(devicePixelRatio, CFG.MAX_PIXEL_RATIO), pixelRatio + 0.1);   // faster than ~57 fps
  if (Math.abs(np - pixelRatio) > 0.01) {
    pixelRatio = np;
    
    renderer.setPixelRatio(np);
    const scale = CFG.QUALITY /1080;
    renderer.setSize(innerWidth * scale, innerHeight * scale, false);
  }
}

// ===================== MAIN LOOP =====================
setCam(0, true);
$('gearMode').textContent = 'AUTO';
const clock = new THREE.Clock();
function renderPreviews() {
  if (gameStarted) return;
  if (preview.car.ready) {
    preview.car.root.rotation.y += 0.003;
    preview.car.renderer.render(preview.car.scene, preview.car.camera);
  }
  for (const item of Object.values(preview.maps)) if (item.ready) item.renderer.render(item.scene, item.camera);
}
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  fpsFrames++; fpsClock += dt;
  if (fpsClock >= 0.5) { $('fps').textContent = `FPS ${Math.round(fpsFrames / fpsClock)}`; fpsFrames = 0; fpsClock = 0; }
  stepCar(dt);
  updateTOD(dt);
  updateCamera(dt);
  updateAudio();
  drawMinimap();
  updateHUD(dt);
  adaptResolution(dt);
  renderPreviews();
  renderer.render(scene, camera);
}
animate();
</script>
